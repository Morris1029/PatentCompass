[project]
name = "patentcompass-api"
version = "0.1.0"
description = "PatentCompass research API and durable background worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "markdown-it-py>=4.2,<5",
    "openpyxl>=3.1,<4",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-timeout>=2.3,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
pythonpath = ["."]
