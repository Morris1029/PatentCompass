<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="applicant_landscape_title applicant_landscape_desc">
<title id="applicant_landscape_title">主体技术布局矩阵（模拟数据）</title>
