<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="geographic_landscape_title geographic_landscape_desc">
<title id="geographic_landscape_title">区域布局对照（模拟数据）</title>
<desc id="geographic_landscape_desc">以示例申请人所在地归类的地区条形图。华东 96 件占 32%，华南 72 件占 24%，华北 54 件占 18%，西南 36 件占 12%，华中 27 件占 9%，东北 15 件占 5%，合计 300 件。示例主题：无人机自主降落。图表示意，模拟数据，不代表真实专利检索结果。</desc>
<defs></defs>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
