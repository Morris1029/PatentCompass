<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>新建导航 · 行业专利导航报告助手</title><link rel="stylesheet" href="assets/minimal.css"></head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="index.html">专利导航</a><nav class="site-nav" aria-label="主导航"><a href="index.html" aria-current="page">新建导航</a><a href="review.html">分析工作台</a><a href="report.html">导航报告</a></nav><span class="preview">静态预览 · 未接入专利数据</span></div></header>
<main class="page narrow start-page">
<div class="page-title"><span class="label">行业专利导航报告助手</span><h1>先看清行业，再决定研发方向。</h1><p class="subtitle">梳理技术路线、主要申请人与地域布局，验证值得探索的方向，<br>把判断和依据放进一份可继续询问的导航报告。</p></div>
<section class="surface" aria-label="新建行业导航">
  <div class="field"><label for="industry">你准备研究哪个行业或产业赛道？</label><input id="industry" name="industry" type="text" placeholder="填写一个边界明确的领域，不必预先选择技术分类"><p class="small">从中国范围开展分析，附全球主要布局对照。</p></div>
  <fieldset><legend>这次分析主要帮助你做什么决定？</legend><div class="goal-options"><label><input type="radio" name="goal" value="entry" checked>进入新行业</label><label><input type="radio" name="goal" value="rd">研发立项</label><label><input type="radio" name="goal" value="direction">选择技术方向</label></div></fieldset>
  <div class="field"><label for="need">你的应用需求或具体问题 <span class="muted small">（可选）</span></label><textarea id="need" rows="3" placeholder="例如：希望解决什么技术问题，关注哪些应用场景，已有方案有什么限制？"></textarea></div>
  <details><summary>时间、专利类型与其他检索条件</summary><div class="detail-body"><div class="form-grid"><div class="field"><label for="start-year">开始年份</label><input id="start-year" type="number" placeholder="待确定"></div><div class="field"><label for="end-year">结束年份</label><input id="end-year" type="number" placeholder="待确定"></div><div class="field"><label for="patent-type">专利类型</label><select id="patent-type"><option>检索前确认</option><option>发明专利</option><option>实用新型</option><option>发明专利与实用新型</option></select></div><div class="field"><label for="regions">全球对照范围</label><input id="regions" type="text" placeholder="按数据覆盖确认主要国家、地区或机构"></div></div><div class="field"><label for="exclusions">竞争对手、关注技术或排除条件</label><input id="exclusions" type="text" placeholder="填写关注或排除内容（可选）"></div><p class="small muted">已有方案、产品描述和参考资料可在范围确认时补充。</p></div></details>
  <div class="actions" style="margin-top:24px;justify-content:space-between"><span class="small muted">先确认范围与技术分支，再开展检索。</span><a class="btn primary" href="scope.html">下一步：确认范围 →</a></div>
</section>
<p class="intro-line">当前为静态设计稿，输入不保存、不执行检索。<a href="review.html">直接浏览分析流程示例 →</a></p>
</main>

<footer class="footer"><span>行业专利导航报告助手 · 页面与分析流程设计预览</span><a href="evidence.html#limitations">数据范围与依据说明 →</a></footer>
</body>
</html>
